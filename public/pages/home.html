<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Video Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: auto;
      background-color: #f4f4f4;
      color: #333;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>AI Educational Video Generator</h1>
  <form id="generateForm">
    <label for="prompt">Enter your topic or prompt for the educational video:</label>
    <textarea id="prompt" name="prompt" placeholder="e.g., Explain how photosynthesis works" required></textarea>
    <button type="submit">Generate Video</button>
  </form>
  <div id="status"></div>

  <script>
   document.getElementById('generateForm').addEventListener('submit', async (e) => {
     e.preventDefault();
     const prompt = document.getElementById('prompt').value;
     const status = document.getElementById('status');
     const button = document.querySelector('button[type="submit"]');

     // Disable button and show loading
     button.disabled = true;
     button.textContent = 'Generating...';
     status.innerHTML = 'Starting video generation...';

     try {
       const response = await fetch('/generate', {
         method: 'POST',
         headers: {
           'Content-Type': 'application/json',
         },
         body: JSON.stringify({ prompt }),
       });

       const data = await response.json();

       if (!response.ok) {
         status.textContent = 'Error: ' + data.message;
         return;
       }

       if (data.status === 'queued' && data.jobId) {
         // Start polling for status
         pollJobStatus(data.jobId, status, button);
       } else {
         status.textContent = 'Unexpected response from server';
       }

     } catch (error) {
       status.textContent = 'Error: ' + error.message;
       button.disabled = false;
       button.textContent = 'Generate Video';
     }
   });

   async function pollJobStatus(jobId, statusElement, button) {
     const pollInterval = setInterval(async () => {
       try {
         const response = await fetch(`/status/${jobId}`);
         const data = await response.json();

         if (data.status === 'queued') {
           statusElement.textContent = 'Video generation queued...';
         } else if (data.status === 'processing') {
           statusElement.textContent = data.message || 'Processing video...';
         } else if (data.status === 'completed') {
           clearInterval(pollInterval);
           statusElement.innerHTML = `
             <p style="color: green; font-weight: bold;">${data.message}</p>
             <a href="${data.downloadUrl}" target="_blank" style="display: inline-block; background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 10px;">Download Video</a>
           `;
           button.disabled = false;
           button.textContent = 'Generate Video';
         } else if (data.status === 'error') {
           clearInterval(pollInterval);
           statusElement.innerHTML = `<p style="color: red; font-weight: bold;">Error: ${data.message}</p>`;
           button.disabled = false;
           button.textContent = 'Generate Video';
         }
       } catch (error) {
         clearInterval(pollInterval);
         statusElement.textContent = 'Error checking status: ' + error.message;
         button.disabled = false;
         button.textContent = 'Generate Video';
       }
     }, 3000); // Poll every 3 seconds
   }
  </script>
</body>
</html>
