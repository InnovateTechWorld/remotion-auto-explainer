<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Video Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: auto;
      background-color: #f4f4f4;
      color: #333;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>AI Educational Video Generator</h1>
  <form id="generateForm">
    <label for="prompt">Enter your topic or prompt for the educational video:</label>
    <textarea id="prompt" name="prompt" placeholder="e.g., Explain how photosynthesis works" required></textarea>
    <button type="submit">Generate Video</button>
  </form>
  <div id="status"></div>

  <script>
    document.getElementById('generateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = document.getElementById('prompt').value;
      const status = document.getElementById('status');
      const button = document.querySelector('button[type="submit"]');

      // Disable button and show loading
      button.disabled = true;
      button.textContent = 'Generating...';
      status.textContent = 'Generating video... This may take 2-3 minutes.';

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt }),
        });

        if (response.ok) {
          // Handle video file download
          const contentDisposition = response.headers.get('Content-Disposition');
          let filename = 'educational_video.mp4';

          if (contentDisposition) {
            const filenameMatch = contentDisposition.match(/filename="(.+)"/);
            if (filenameMatch) {
              filename = filenameMatch[1];
            }
          }

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);

          status.textContent = 'Video downloaded successfully!';
        } else {
          // Handle error response
          const errorText = await response.text();
          let errorMessage = 'Unknown error occurred';

          try {
            const errorData = JSON.parse(errorText);
            errorMessage = errorData.message || errorMessage;
          } catch {
            errorMessage = errorText || errorMessage;
          }

          status.textContent = 'Error: ' + errorMessage;
        }
      } catch (error) {
        status.textContent = 'Error: ' + error.message;
      } finally {
        // Re-enable button
        button.disabled = false;
        button.textContent = 'Generate Video';
      }
    });
  </script>
</body>
</html>
